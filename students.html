<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management | PMD Learning Centre</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f6fa;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.header h2{
color:#222;
}

.add-btn{
background:#F57C00;
color:#fff;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:600;
}

.search-box{
margin-bottom:25px;
}

.search-box input{
width:100%;
padding:14px;
border:2px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
}

.student-form{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:15px;

background:#fff;

padding:25px;

border-radius:18px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

margin-bottom:30px;

}

.student-form input,
.student-form select{

padding:13px;

border:2px solid #ddd;

border-radius:10px;

outline:none;

}

.student-form button{

background:#F57C00;

color:#fff;

border:none;

padding:14px;

border-radius:10px;

cursor:pointer;

font-size:15px;

font-weight:600;

}

.table-box{

background:#fff;

padding:20px;

border-radius:18px;

overflow:auto;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

table{

width:100%;

border-collapse:collapse;

}

th{

background:#F57C00;

color:white;

padding:15px;

}

td{

padding:15px;

border-bottom:1px solid #eee;

text-align:center;

}

.action-btn{

padding:8px 12px;

border:none;

border-radius:6px;

cursor:pointer;

margin:2px;

}

.edit{

background:#2196F3;

color:white;

}

.delete{

background:#F44336;

color:white;

}

@media(max-width:700px){

.container{

padding:15px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>🎓 Student Management</h2>

<button class="add-btn">

+ Add New Student

</button>

</div>

<div class="search-box">

<input
type="text"
id="searchStudent"
placeholder="Search Student...">

</div>
<!-- Student Form -->

<form id="studentForm" class="student-form">

<input
type="text"
id="studentName"
placeholder="Student Full Name"
required>

<input
type="email"
id="studentEmail"
placeholder="Email Address"
required>

<input
type="tel"
id="studentMobile"
placeholder="Mobile Number"
required>

<select
id="studentCourse"
required>

<option value="">Select Course</option>

<option>LDC</option>

<option>Rajasthan GK</option>

<option>CET</option>

<option>REET</option>

<option>Patwari</option>

<option>Police</option>

<option>SSC</option>

<option>Banking</option>

</select>

<select
id="studentStatus">

<option value="Active">Active</option>

<option value="Inactive">Inactive</option>

</select>

<button type="submit">

Save Student

</button>

</form>

<!-- Student List -->

<div class="table-box">

<table>

<thead>

<tr>

<th>Student ID</th>

<th>Name</th>

<th>Email</th>

<th>Mobile</th>

<th>Course</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="studentTable">

<tr>

<td>PMD001</td>

<td>Demo Student</td>

<td>student@example.com</td>

<td>9876543210</td>

<td>LDC</td>

<td>Active</td>

<td>

<button class="action-btn edit">

Edit

</button>

<button class="action-btn delete">

Delete

</button>

</td>

</tr>

</tbody>

</table>

</div>

<footer style="margin-top:30px;text-align:center;color:#777;">

© 2026 PMD Learning Centre | Student Management

</footer>

<script type="module" src="firebase.js"></script>

<script src="students.js"></script>
<script type="module">

import { auth } from "./firebase.js";

import { onAuthStateChanged }

from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// =============================
// Admin Authentication
// =============================

onAuthStateChanged(auth,(user)=>{

    if(!user){

        window.location.href="login.html";

    }

});

// =============================
// Search Student
// =============================

const searchInput=document.getElementById("searchStudent");

const table=document.getElementById("studentTable");

searchInput.addEventListener("keyup",()=>{

const value=searchInput.value.toLowerCase();

const rows=table.querySelectorAll("tr");

rows.forEach(row=>{

row.style.display=row.innerText
.toLowerCase()
.includes(value)

? ""

: "none";

});

});

// =============================
// Add Student Button
// =============================

document.querySelector(".add-btn")

.addEventListener("click",()=>{

document.getElementById("studentName").focus();

});

// =============================
// Success Message
// =============================

document.getElementById("studentForm")

.addEventListener("submit",(e)=>{

e.preventDefault();

alert(

"Student data will be saved to Firebase."

);

});

// =============================
// Console
// =============================

console.log(

"%cPMD Learning Centre V2",

"color:#F57C00;font-size:18px;font-weight:bold;"

);

console.log(

"Student Management Ready."

);

</script>

</body>

</html>
