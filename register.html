<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - PMD Learning Centre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>PMD Learning Centre</h1>
</header>

<div class="login-box">
<h2>Student Registration</h2>

<input type="text" id="name" placeholder="पूरा नाम">
<input type="email" id="email" placeholder="ईमेल">
<input type="password" id="password" placeholder="पासवर्ड">
<input type="password" id="confirmPassword" placeholder="पासवर्ड दोबारा लिखें">

<button id="registerBtn">Register</button>


<p>पहले से अकाउंट है?
<a href="login.html">Login</a>
</p>

</div>
<script type="module">
import { auth } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const btn = document.getElementById("registerBtn");

btn.addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("पासवर्ड मैच नहीं कर रहे हैं।");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, password);

    alert("Registration Successful!");

    window.location.href = "login.html";

  } catch (error) {
    alert(error.message);
  }

});
</script>
</body>
</html>
