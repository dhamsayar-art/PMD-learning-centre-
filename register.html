<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - PMD Learning Centre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>PMD Learning Centre</h1>
</header>

<div class="login-box">
<h2>Student Registration</h2>

<input type="text" id="name" placeholder="पूरा नाम">
<input type="email" id="email" placeholder="ईमेल">
<input type="password" id="password" placeholder="पासवर्ड">
<input type="password" id="confirmPassword" placeholder="पासवर्ड दोबारा लिखें">

<button id="registerBtn">Register</button>


<p>पहले से अकाउंट है?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
