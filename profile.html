<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>👤 My Profile</h1>
</header>

<div class="login-box">

<input type="text" id="name" placeholder="पूरा नाम">

<input type="tel" id="mobile" placeholder="मोबाइल नंबर">

<input type="text" id="course" placeholder="कोर्स">

<input type="text" id="address" placeholder="पता">

<button id="saveBtn">Save Profile</button>

</div>
<script type="module">
import { auth, db } from "./firebase.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

let currentUser = null;

// Check Login
onAuthStateChanged(auth, (user) => {

    if(user){
        currentUser = user;
    }else{
        window.location.href="login.html";
    }

});

// Save Profile
document.getElementById("saveBtn").addEventListener("click", async()=>{

const name=document.getElementById("name").value;
const mobile=document.getElementById("mobile").value;
const course=document.getElementById("course").value;
const address=document.getElementById("address").value;

try{

await setDoc(doc(db,"students",currentUser.uid),{

name:name,
mobile:mobile,
course:course,
address:address,
email:currentUser.email

});

alert("Profile Saved Successfully!");

}catch(error){

alert(error.message);

}

});
</script>
</body>
</html>
