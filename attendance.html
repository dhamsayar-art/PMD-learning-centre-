<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Management | PMD Learning Centre</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f6fa;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.header h2{
color:#222;
}

.add-btn{
background:#F57C00;
color:#fff;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:600;
}

.search-box{
margin-bottom:25px;
}

.search-box input{
width:100%;
padding:14px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
font-size:15px;
}

.attendance-form{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;

background:#fff;
padding:25px;
border-radius:18px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

margin-bottom:30px;

}

.attendance-form input,
.attendance-form select{

padding:13px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
font-size:15px;

}

.attendance-form button{

background:#F57C00;
color:#fff;
border:none;
padding:14px;
border-radius:10px;
cursor:pointer;
font-weight:600;

}

.table-box{

background:#fff;
padding:20px;
border-radius:18px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

table{

width:100%;
border-collapse:collapse;

}

th{

background:#F57C00;
color:#fff;
padding:15px;

}

td{

padding:15px;
text-align:center;
border-bottom:1px solid #eee;

}

.action-btn{

padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
margin:2px;

}

.edit{
background:#2196F3;
color:#fff;
}

.delete{
background:#F44336;
color:#fff;
}

.report{
background:#4CAF50;
color:#fff;
}

@media(max-width:700px){

.container{
padding:15px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>📅 Attendance Management</h2>

<button class="add-btn">

+ Mark Attendance

</button>

</div>

<div class="search-box">

<input
type="text"
id="searchAttendance"
placeholder="Search Student or Teacher...">

</div>
<!-- Attendance Form -->

<form id="attendanceForm" class="attendance-form">

<select
id="personType"
required>

<option value="">Select Type</option>

<option value="Student">Student</option>

<option value="Teacher">Teacher</option>

</select>

<input
type="text"
id="personName"
placeholder="Student / Teacher Name"
required>

<select
id="courseName"
required>

<option value="">Select Course</option>

<option>LDC</option>

<option>Rajasthan GK</option>

<option>CET</option>

<option>REET</option>

<option>Patwari</option>

<option>Police</option>

<option>SSC</option>

<option>Banking</option>

</select>

<input
type="date"
id="attendanceDate"
required>

<select
id="attendanceStatus"
required>

<option value="">Attendance Status</option>

<option value="Present">✅ Present</option>

<option value="Absent">❌ Absent</option>

<option value="Late">⏰ Late</option>

<option value="Leave">🏖 Leave</option>

</select>

<button type="submit">

Save Attendance

</button>

</form>

<!-- Attendance Table -->

<div class="table-box">

<table>

<thead>

<tr>

<th>ID</th>

<th>Type</th>

<th>Name</th>

<th>Course</th>

<th>Date</th>

<th>Status</th>

<th>Report</th>

<th>Action</th>

</tr>

</thead>

<tbody id="attendanceTable">

<tr>

<td>ATT001</td>

<td>Student</td>

<td>Demo Student</td>

<td>LDC</td>

<td>29-07-2026</td>

<td>Present</td>

<td>

<button class="action-btn report">

Report

</button>

</td>

<td>

<button class="action-btn edit">

Edit

</button>

<button class="action-btn delete">

Delete

</button>

</td>

</tr>

</tbody>

</table>

</div>

<footer style="margin-top:30px;text-align:center;color:#777;">

© 2026 PMD Learning Centre | Attendance Management

</footer>

<script type="module" src="firebase.js"></script>

<script src="attendance.js"></script>
<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// =============================
// Admin Authentication
// =============================

onAuthStateChanged(auth,(user)=>{

    if(!user){

        window.location.href="login.html";

    }

});

// =============================
// Auto Today's Date
// =============================

const attendanceDate =
document.getElementById("attendanceDate");

attendanceDate.value =
new Date().toISOString().split("T")[0];

// =============================
// Search Attendance
// =============================

const searchInput =
document.getElementById("searchAttendance");

const attendanceTable =
document.getElementById("attendanceTable");

searchInput.addEventListener("keyup",()=>{

    const value =
    searchInput.value.toLowerCase();

    const rows =
    attendanceTable.querySelectorAll("tr");

    rows.forEach(row=>{

        row.style.display =
        row.innerText
        .toLowerCase()
        .includes(value)
        ? ""
        : "none";

    });

});

// =============================
// Add Attendance Button
// =============================

document.querySelector(".add-btn")

.addEventListener("click",()=>{

    document
    .getElementById("personName")
    .focus();

});

// =============================
// Form Validation
// =============================

document
.getElementById("attendanceForm")

.addEventListener("submit",(e)=>{

    e.preventDefault();

    alert(
    "Attendance will be saved to Firebase."
    );

});

// =============================
// Report Button
// =============================

attendanceTable.addEventListener("click",(e)=>{

    if(
    e.target.classList.contains("report")
    ){

        alert(
        "Attendance Report will open after attendance.js integration."
        );

    }

});

// =============================
// Console
// =============================

console.log(

"%cPMD Learning Centre V2",

"color:#F57C00;font-size:18px;font-weight:bold;"

);

console.log("Attendance Management Ready");

</script>

</body>

</html>
