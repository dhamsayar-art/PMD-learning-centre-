<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | PMD Learning Centre</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#FFD54F,#FFB300,#F57C00);
            overflow:hidden;
            position:relative;
        }

        /* Animated Background */

        body::before{
            content:"";
            position:absolute;
            width:500px;
            height:500px;
            border-radius:50%;
            background:rgba(255,255,255,.15);
            top:-180px;
            left:-150px;
            animation:float1 8s infinite alternate;
        }

        body::after{
            content:"";
            position:absolute;
            width:400px;
            height:400px;
            border-radius:50%;
            background:rgba(255,255,255,.12);
            bottom:-150px;
            right:-100px;
            animation:float2 7s infinite alternate;
        }

        @keyframes float1{
            from{transform:translateY(0);}
            to{transform:translateY(60px);}
        }

        @keyframes float2{
            from{transform:translateY(0);}
            to{transform:translateY(-60px);}
        }

        .login-container{
            position:relative;
            z-index:10;
            width:100%;
            max-width:450px;
            margin:20px;
        }

        .login-card{
            background:#fff;
            border-radius:25px;
            padding:40px 30px;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
        }

        .logo{
            text-align:center;
            margin-bottom:20px;
        }

        .logo img{
            width:110px;
        }

        .logo h2{
            margin-top:12px;
            color:#222;
            font-size:28px;
            font-weight:700;
        }

        .logo p{
            color:#777;
            font-size:14px;
            margin-top:6px;
        }

        .input-box{
            position:relative;
            margin-top:20px;
        }

        .input-box input{
            width:100%;
            padding:15px 50px 15px 45px;
            border:2px solid #ddd;
            border-radius:12px;
            outline:none;
            font-size:15px;
            transition:.3s;
        }

        .input-box input:focus{
            border-color:#F57C00;
        }

        .input-box i{
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:#888;
        }

        .togglePassword{
            position:absolute;
            right:15px;
            top:50%;
            transform:translateY(-50%);
            cursor:pointer;
            color:#666;
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:18px;
            font-size:14px;
        }

        .options a{
            text-decoration:none;
            color:#F57C00;
            font-weight:600;
        }

        .login-btn{
            width:100%;
            margin-top:25px;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#F57C00;
            color:#fff;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        .login-btn:hover{
            background:#E65100;
        }
        .divider{
            display:flex;
            align-items:center;
            margin:25px 0;
            color:#888;
            font-size:14px;
        }

        .divider::before,
        .divider::after{
            content:"";
            flex:1;
            height:1px;
            background:#ddd;
        }

        .divider span{
            padding:0 15px;
        }

        .google-btn{
            width:100%;
            padding:14px;
            border:2px solid #ddd;
            border-radius:12px;
            background:#fff;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
            transition:.3s;
        }

        .google-btn:hover{
            background:#f5f5f5;
            border-color:#F57C00;
        }

        .google-btn i{
            color:#DB4437;
            margin-right:8px;
        }

        .message{
            display:none;
            margin-top:18px;
            padding:12px;
            border-radius:10px;
            text-align:center;
            font-size:14px;
        }

        .success{
            background:#d4edda;
            color:#155724;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
        }

        .register{
            margin-top:25px;
            text-align:center;
            font-size:15px;
        }

        .register a{
            color:#F57C00;
            text-decoration:none;
            font-weight:600;
        }

        footer{
            margin-top:25px;
            text-align:center;
            color:#777;
            font-size:13px;
        }

        @media(max-width:500px){

            .login-card{
                padding:30px 20px;
            }

            .logo h2{
                font-size:24px;
            }

        }

    </style>
</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="logo">

<img src="images/logo.png" alt="PMD Logo">

<h2>PMD Learning Centre</h2>

<p>Welcome Back! Login to Continue</p>

</div>

<form id="loginForm">

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Enter Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<i class="fa-solid fa-eye togglePassword"
id="togglePassword"></i>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="forgot-password.html">

Forgot Password?

</a>

</div>

<button
type="submit"
class="login-btn">

Login

</button>

<div class="divider">

<span>OR</span>

</div>

<button
type="button"
class="google-btn"
id="googleLogin">

<i class="fab fa-google"></i>

Continue with Google

</button>

<div
id="message"
class="message">

</div>

<div class="register">

Don't have an account?

<a href="register.html">

Register Now

</a>

</div>

<footer>

© 2026 PMD Learning Centre
All Rights Reserved.

</footer>
</form>

</div>

</div>

<!-- Loading Overlay -->
<div id="loadingScreen" class="loading-screen" style="display:none;">
    <div class="loader"></div>
    <p>Signing In...</p>
</div>

<style>
.loading-screen{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.95);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.loader{
    width:55px;
    height:55px;
    border:6px solid #eee;
    border-top:6px solid #F57C00;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

.loading-screen p{
    margin-top:15px;
    color:#333;
    font-weight:600;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}
</style>

<!-- Firebase SDK -->
<script type="module" src="firebase.js"></script>

<!-- Login Script -->
<script type="module" src="login.js"></script>

<script>

const password=document.getElementById("password");
const toggle=document.getElementById("togglePassword");

toggle.addEventListener("click",()=>{

if(password.type==="password"){

password.type="text";
toggle.classList.remove("fa-eye");
toggle.classList.add("fa-eye-slash");

}else{

password.type="password";
toggle.classList.remove("fa-eye-slash");
toggle.classList.add("fa-eye");

}

});

</script>

</body>

</html>
