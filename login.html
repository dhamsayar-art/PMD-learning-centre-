<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PMD Learning Centre</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>PMD Learning Centre</h1>
</header>

<div class="login-box">
<h2>Student Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p>New Student? <a href="register.html">Register</a></p>

</div>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>
</a>

<p>New Student? <a href="register.html">Register</a></p>

</div>
<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

document.getElementById("loginBtn").addEventListener("click", async () => {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
        await signInWithEmailAndPassword(auth, email, password);

        alert("Login Successful!");

        window.location.href = "dashboard.html";

    } catch (error) {
        alert("Login Failed: " + error.message);
    }

});
</script>
</body>
</html>
