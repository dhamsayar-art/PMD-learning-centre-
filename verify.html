<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Verify Certificate / ID | PMD Learning Centre</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6f9;
}

.container{

max-width:900px;

margin:40px auto;

padding:20px;

}

.verify-card{

background:#fff;

border-radius:20px;

padding:30px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}

.verify-card h2{

text-align:center;

color:#F57C00;

margin-bottom:25px;

}

.search-box{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-bottom:25px;

}

.search-box input{

flex:1;

padding:14px;

border:2px solid #ddd;

border-radius:10px;

font-size:16px;

outline:none;

}

.search-box button{

padding:14px 25px;

background:#F57C00;

color:#fff;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:600;

}

.result-box{

display:none;

margin-top:25px;

padding:20px;

border-radius:15px;

background:#fafafa;

border:2px solid #eee;

}

.result-box img{

width:120px;

height:120px;

border-radius:50%;

object-fit:cover;

display:block;

margin:0 auto 20px;

border:4px solid #F57C00;

}

.result-box p{

margin:10px 0;

font-size:16px;

}

.status{

text-align:center;

font-size:20px;

font-weight:bold;

margin-top:20px;

}

.valid{

color:#2E7D32;

}

.invalid{

color:#D32F2F;

}

</style>

</head>

<body>

<div class="container">

<div class="verify-card">

<h2>

🔍 Certificate / Student ID Verification

</h2>
<div class="search-box">

<input
type="text"
id="verifyInput"
placeholder="Enter Certificate Number or Student ID">

<button
id="verifyBtn">

Verify

</button>

</div>

<!-- Verification Result -->

<div
id="resultBox"
class="result-box">

<img
id="studentPhoto"
src="images/default-user.png"
alt="Student Photo">

<p>

<strong>Name :</strong>

<span id="studentName">

--

</span>

</p>

<p>

<strong>Father's Name :</strong>

<span id="fatherName">

--

</span>

</p>

<p>

<strong>Student ID :</strong>

<span id="studentId">

--

</span>

</p>

<p>

<strong>Certificate No :</strong>

<span id="certificateNo">

--

</span>

</p>

<p>

<strong>Course :</strong>

<span id="courseName">

--

</span>

</p>

<p>

<strong>Completion Date :</strong>

<span id="completionDate">

--

</span>

</p>

<p>

<strong>Grade :</strong>

<span id="grade">

--

</span>

</p>

<p>

<strong>Valid Upto :</strong>

<span id="validUpto">

--

</span>

</p>

<div
id="verificationStatus"
class="status">

Waiting for Verification...

</div>

</div>

</div>

</div>

<footer
style="text-align:center;margin:30px;color:#777;">

© 2026 PMD Learning Centre | Verification System

</footer>

<script type="module" src="firebase.js"></script>

<script src="verify.js"></script>
<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// =============================
// Authentication (Optional)
// =============================

onAuthStateChanged(auth,(user)=>{

    console.log(
        user
        ? "Admin Logged In"
        : "Public Verification Mode"
    );

});

// =============================
// Elements
// =============================

const verifyInput =
document.getElementById("verifyInput");

const verifyBtn =
document.getElementById("verifyBtn");

// =============================
// Auto Fill from URL
// Example:
// verify.html?id=PMD001
// verify.html?certificate=PMD-2026-1001
// =============================

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");

const certificate =
params.get("certificate");

if(id){

    verifyInput.value = id;

}

if(certificate){

    verifyInput.value = certificate;

}

// =============================
// Verify Button
// =============================

verifyBtn.addEventListener("click",()=>{

    if(
        verifyInput.value.trim()===""
    ){

        alert(
            "Please enter Student ID or Certificate Number."
        );

        return;

    }

});

// Press Enter to Verify

verifyInput.addEventListener("keypress",(e)=>{

    if(e.key==="Enter"){

        e.preventDefault();

        verifyBtn.click();

    }

});

// =============================
// Console
// =============================

console.log(

"%cPMD Learning Centre V2",

"color:#F57C00;font-size:18px;font-weight:bold;"

);

console.log(
"Verification Page Ready"
);

</script>

</body>

</html>
