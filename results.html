<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Result Management | PMD Learning Centre</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f6fa;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.header h2{
color:#222;
}

.add-btn{

background:#F57C00;
color:#fff;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:600;

}

.search-box{

margin-bottom:25px;

}

.search-box input{

width:100%;
padding:14px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
font-size:15px;

}

.result-form{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;

background:#fff;
padding:25px;
border-radius:18px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

margin-bottom:30px;

}

.result-form input,
.result-form select{

padding:13px;
border:2px solid #ddd;
border-radius:10px;
outline:none;
font-size:15px;

}

.result-form button{

background:#F57C00;
color:white;
border:none;
padding:14px;
border-radius:10px;
cursor:pointer;
font-size:15px;
font-weight:600;

}

.table-box{

background:white;
padding:20px;
border-radius:18px;
overflow:auto;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

table{

width:100%;
border-collapse:collapse;

}

th{

background:#F57C00;
color:white;
padding:15px;

}

td{

padding:15px;
text-align:center;
border-bottom:1px solid #eee;

}

.action-btn{

padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
margin:2px;

}

.edit{

background:#2196F3;
color:white;

}

.delete{

background:#F44336;
color:white;

}

.view{

background:#4CAF50;
color:white;

}

@media(max-width:700px){

.container{

padding:15px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>📊 Result Management</h2>

<button class="add-btn">

+ Add Result

</button>

</div>

<div class="search-box">

<input
type="text"
id="searchResult"
placeholder="Search Student Result...">

</div>
<!-- Result Form -->

<form id="resultForm" class="result-form">

<input
type="text"
id="studentName"
placeholder="Student Name"
required>

<input
type="text"
id="quizName"
placeholder="Quiz Name"
required>

<input
type="number"
id="totalMarks"
placeholder="Total Marks"
required>

<input
type="number"
id="obtainedMarks"
placeholder="Obtained Marks"
required>

<input
type="number"
id="percentage"
placeholder="Percentage"
readonly>

<select
id="resultStatus"
required>

<option value="">Select Result</option>

<option value="Pass">Pass</option>

<option value="Fail">Fail</option>

</select>

<button type="submit">

Save Result

</button>

</form>

<!-- Result Table -->

<div class="table-box">

<table>

<thead>

<tr>

<th>Result ID</th>

<th>Student</th>

<th>Quiz</th>

<th>Marks</th>

<th>Percentage</th>

<th>Status</th>

<th>View</th>

<th>Action</th>

</tr>

</thead>

<tbody id="resultTable">

<tr>

<td>RST001</td>

<td>Demo Student</td>

<td>Rajasthan GK Test</td>

<td>45 / 50</td>

<td>90%</td>

<td>Pass</td>

<td>

<button class="action-btn view">

View

</button>

</td>

<td>

<button class="action-btn edit">

Edit

</button>

<button class="action-btn delete">

Delete

</button>

</td>

</tr>

</tbody>

</table>

</div>

<footer
style="margin-top:30px;text-align:center;color:#777;">

© 2026 PMD Learning Centre | Result Management

</footer>

<script type="module" src="firebase.js"></script>

<script src="results.js"></script>
<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

// =============================
// Admin Authentication
// =============================

onAuthStateChanged(auth,(user)=>{

    if(!user){

        window.location.href="login.html";

    }

});

// =============================
// Auto Percentage Calculator
// =============================

const totalMarks =
document.getElementById("totalMarks");

const obtainedMarks =
document.getElementById("obtainedMarks");

const percentage =
document.getElementById("percentage");

function calculatePercentage(){

    const total = Number(totalMarks.value);

    const obtained = Number(obtainedMarks.value);

    if(total>0){

        percentage.value =
        ((obtained/total)*100).toFixed(2);

    }else{

        percentage.value = "";

    }

}

totalMarks.addEventListener("input",calculatePercentage);

obtainedMarks.addEventListener("input",calculatePercentage);

// =============================
// Search Result
// =============================

const searchInput =
document.getElementById("searchResult");

const resultTable =
document.getElementById("resultTable");

searchInput.addEventListener("keyup",()=>{

    const value =
    searchInput.value.toLowerCase();

    const rows =
    resultTable.querySelectorAll("tr");

    rows.forEach(row=>{

        row.style.display =
        row.innerText.toLowerCase().includes(value)

        ? ""

        : "none";

    });

});

// =============================
// Add Result Button
// =============================

document.querySelector(".add-btn")

.addEventListener("click",()=>{

    document
    .getElementById("studentName")
    .focus();

});

// =============================
// Form Validation
// =============================

document
.getElementById("resultForm")

.addEventListener("submit",(e)=>{

    e.preventDefault();

    alert(

    "Result will be saved to Firebase."

    );

});

// =============================
// View Result
// =============================

resultTable.addEventListener("click",(e)=>{

    if(
    e.target.classList.contains("view")
    ){

        alert(
        "Detailed Result Page will open after results.js integration."
        );

    }

});

// =============================
// Console
// =============================

console.log(

"%cPMD Learning Centre V2",

"color:#F57C00;font-size:18px;font-weight:bold;"

);

console.log("Result Management Ready");

</script>

</body>

</html>
