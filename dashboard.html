<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>🎓 Student Dashboard</h1>
<p id="welcome">Welcome to PMD Learning Centre</p>
</header>
<p id="userEmail"></p>

<button id="logoutBtn">Logout</button>
<div class="subjects">

<div class="card">
<h3>📚 My Courses</h3>
<p>आपके सभी विषय यहाँ दिखाई देंगे।</p>
</div>

<div class="card">
<h3>📝 My Quiz</h3>
<p>आपके टेस्ट और अंक यहाँ दिखाई देंगे।</p>
</div>

<div class="card">
<h3>📄 My Notes</h3>
<p>डाउनलोड किए गए नोट्स यहाँ दिखाई देंगे।</p>
</div>

<div class="card">
<h3>👤 My Profile</h3>

<p>अपनी प्रोफ़ाइल अपडेट करें।</p>

<a href="profile.html">
<button>Open Profile</button>
</a>

</div>

</div>
<script type="module">import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

// Check Login
onAuthStateChanged(auth, (user) => {

    if (user) {
        document.getElementById("userEmail").innerText =
            "👤 " + user.email;
    } else {
        window.location.href = "login.html";
    }

});
const docRef = doc(db, "students", user.uid);
const docSnap = await getDoc(docRef);

if (docSnap.exists()) {
    document.getElementById("welcome").innerText =
        "👋 Welcome, " + docSnap.data().name;
}

// Logout
document.getElementById("logoutBtn").addEventListener("click", () => {

    signOut(auth).then(() => {
        alert("Logout Successful");
        window.location.href = "login.html";
    });

});
</script>
</body>
</html>
